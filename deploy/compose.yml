services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      DEMO_MODE: 'true'
      DATABASE_PATH: /app/.data/lendinghub.sqlite
      UPLOAD_DIR: /app/.data/uploads
    volumes:
      - lending_data:/app/.data
    expose:
      - '3000'
    mem_limit: 512m
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  lending_data:
  caddy_data:
  caddy_config:
